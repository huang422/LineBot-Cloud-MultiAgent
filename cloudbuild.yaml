# Build pipeline for LineBot-CloudAgent: lint + tests, then build and push
# the container image. Nothing here deploys or reads secrets.
#
# Preferred entrypoint (it also deploys the pushed image from your machine):
#   ./scripts/deploy_cloud_run.sh
#
# Direct use example (image build only):
#   gcloud builds submit . \
#     --project YOUR_PROJECT_ID \
#     --config cloudbuild.yaml \
#     --substitutions=_REGION=us-west1,_IMAGE_TAG=manual-20260929
#
# The Artifact Registry repository must already exist; the deploy wrapper
# (and scripts/provision_gcp.sh --step builder-sa) creates it. Once
# provisioned, the wrapper submits the build as linebot-builder
# (--service-account) with the source staged in gs://<project>-cb-src-usw1
# (--gcs-source-staging-dir); see docs/adr/0008-secrets-and-identity.md.

substitutions:
  _REGION: us-west1
  _AR_REPOSITORY: linebot-cloud-agent
  _IMAGE_TAG: latest
  _SKIP_TESTS: "false"

options:
  substitutionOption: ALLOW_LOOSE
  # Logs go to Cloud Logging only (no GCS logs bucket), which a user-specified
  # build service account requires. `gcloud beta builds submit` streams them;
  # `gcloud builds log BUILD_ID` prints them afterwards.
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  # Same pinned base image as the Dockerfile (bump both together), so tests
  # run on the interpreter the service runs on.
  - id: test
    name: 'python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f'
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_SKIP_TESTS}" == "true" ]]; then
          echo "[skip] Lint, unit tests and syntax checks disabled"
          exit 0
        fi

        python -m pip install --disable-pip-version-check --no-cache-dir \
          --require-hashes --no-deps -r requirements-dev.lock
        python -m ruff check --no-cache .
        python -m pytest -q -p no:cacheprovider
        python -m compileall -q main.py src scripts tests

  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/app:${_IMAGE_TAG}
      - .

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/app:${_IMAGE_TAG}
