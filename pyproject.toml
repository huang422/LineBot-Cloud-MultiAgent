[project]
name = "linebot-cloud-agent"
# Required by the [project] table; the service reports APP_VERSION instead.
version = "3.0.0"
description = "LINE bot on Cloud Run (an application, not a library: uv never builds or installs it)"
requires-python = ">=3.12"
# Runtime dependencies: the only list to edit by hand. `uv lock` resolves them
# into uv.lock (every file sha256-pinned); the image installs
# `uv export --no-dev` of it with pip --require-hashes --no-deps (Dockerfile;
# DEPLOY.md, "依賴鎖定與本機驗證").
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # HTTP Client (OpenRouter + LINE API)
    "httpx>=0.26.0",
    # httpx's connection layer; the page fetcher plugs its SSRF-checked network
    # backend into it (src/services/search/page_fetcher.py).
    "httpcore>=1.0.9",

    # Data Validation & Settings
    # 2.10.3 (pydantic-core 2.27.1): the oldest checked to have PydanticUseDefault,
    # which src/config.py raises from a before-validator.
    "pydantic>=2.10.3",
    # 2.7: NoDecode (src/config.py decodes the scheduled-job lists itself).
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",

    # Image Processing
    "Pillow>=10.2.0",

    # Text-to-Speech (completely free, no API key). 7.3.0 added the Sec-MS-GEC
    # v2 token; older releases get HTTP 403 from the speech service (2026-10).
    "edge-tts>=7.3.1",
    "mutagen>=1.47.0",

    # Web page text extraction (search results and URLs users send). Imported
    # lazily, inside its own worker threads: ~1 s and ~50 MB the first time.
    # Search itself (Tavily) is plain httpx. ADR-0009.
    "trafilatura==2.2.0",

    # Chinese Simplified → Traditional conversion
    "opencc-python-reimplemented>=0.1.7",

    # GCP Cloud Storage (for audio/image temp URLs)
    "google-cloud-storage>=2.14.0",

    # GCP Firestore Native (persistent long-term memory; optional)
    # Free tier: 50K reads / 20K writes / 1 GiB storage per day.
    # Disable via FIRESTORE_ENABLED=false to fall back to in-memory.
    "google-cloud-firestore>=2.16.0",
    # Its error classes (Conflict, FailedPrecondition): the Colab state store's
    # conditional writes (src/services/colab/state.py). Already locked as a
    # dependency of the Firestore client.
    "google-api-core>=2.16.0",

    # Timezone database for zoneinfo (Asia/Taipei scheduling under python:3.12-slim)
    "tzdata>=2024.1",

    # Colab control plane (src/services/colab/control_plane.py, ADR-0010): the
    # google-colab-cli LIBRARY, never the `colab` binary, imported lazily and only
    # there. What only its CLI or optional paths need never enters the lock:
    # see exclude-dependencies under [tool.uv] below.
    "google-colab-cli==0.7.4",
    "jupyter-kernel-client==0.9.0",
    "jupyter-mimetypes==0.2.0",
    # What those three modules import at run time.
    "jupyter-client>=8.6.3",
    "jupyter-core",
    "traitlets>=5.3",
    # googlecolab/google-colab-cli#81: an older pyzmq crashes the kernel client.
    "pyzmq>=26",
    "tornado",
    "python-dateutil",
    "websocket-client>=1.6",
    "rich",
    "html2text",
    # colab_cli.state, imported by colab_cli.contents.
    "filelock",
    "requests",
    "google-auth",
]

[dependency-groups]
# Cloud Build and local tests only; never in the image (uv export --no-dev).
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.16.4",
]

[tool.uv]
# Not a package: uv sync and uv export never build, install or emit the
# project itself.
package = false
# exclude-dependencies needs a recent uv; the Dockerfile and Cloud Build pin
# ghcr.io/astral-sh/uv:0.12.6 by digest.
required-version = ">=0.12.6"
# google-colab-cli is used as a library (colab_cli.client, .runtime and
# .contents; ADR-0010), and those never import its CLI or optional-path
# dependencies. Leave them out of the resolution entirely, so uv.lock, the
# image and the dev environment never contain them or what only they need
# (jsonschema, oauthlib, shellingham, wcwidth, ...). pyarrow alone is ~157 MB,
# through jupyter-mimetypes. tests/test_packaging.py checks that the lock has
# none of them and that the three modules import without them.
exclude-dependencies = [
    "google-auth-oauthlib",
    "nbformat",
    "prompt-toolkit",
    "pyarrow",
    "typer",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv*", "venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# Start deliberately narrow: correctness-flavoured rules that catch real
# defects (undefined names, unused imports, shadowed builtins, mutable
# defaults) without churning the existing style. Widen once this is clean.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is idiomatic
    # MemoryBackend deliberately ships no-op defaults for optional
    # capabilities (delete/episodes) so backends degrade gracefully.
    "B027",
    # InputType stays (str, Enum): switching to StrEnum changes what
    # str() returns, which leaks into logs and cached payloads.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Re-exported for backwards compatibility with existing import paths.
"main.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
